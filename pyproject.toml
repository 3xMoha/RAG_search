[project]
name = "rag-search"
version = "0.1.0"
description = "A small RAG search system built for learning."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sentence-transformers>=6.0,<7.0",
]

[project.scripts]
rag-search = "rag.cli:main"

[dependency-groups]
test = [
    "pytest>=8.0,<9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]