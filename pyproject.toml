[project]
name = "rag-search"
version = "0.1.0"
description = "A small RAG search system built for learning."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ebooklib>=0.20",
    "prompt-toolkit>=3.0,<4",
    "pypdf>=6.19.0",
    "sentence-transformers>=6.0,<7.0",
]

[project.scripts]
rag-search = "rag.cli:main"

[dependency-groups]
test = [
    "pytest>=8.0,<9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
